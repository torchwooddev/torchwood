syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";

// 服务默认 access=public：swagger 顶层不声明全局 security（匿名可达），
// 仅声明 securityDefinitions 供统一引用（详见 shared/v1/openapi.proto）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "Server API key（需同时携带 X-Torchwood-Project 请求头）"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "public" }
  }
};

service HealthService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_PUBLIC };

  rpc Check(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/v1/health"
      additional_bindings { get: "/v1/server/health" }
    };
  }
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {
    option (google.api.http) = { get: "/v1/server/health/version" };
  }
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  repeated DependencyStatus dependencies = 2;
}

message DependencyStatus {
  string name = 1;
  string status = 2;
  string error = 3;
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  string commit = 2;
  string date = 3;
}
