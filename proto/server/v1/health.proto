syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "shared/v1/authz.proto";

service HealthService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_PUBLIC };

  rpc Check(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/v1/health"
      additional_bindings { get: "/v1/server/health" }
    };
  }
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {
    option (google.api.http) = { get: "/v1/server/health/version" };
  }
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  repeated DependencyStatus dependencies = 2;
}

message DependencyStatus {
  string name = 1;
  string status = 2;
  string error = 3;
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  string commit = 2;
  string date = 3;
}
