syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";
import "shared/v1/document.proto";
import "shared/v1/query.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "项目绑定在密钥行上，不需要 X-Torchwood-Project。该头仅 Console admin 会话切换项目。"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "api_key" }
  }
  // 统一 default 错误响应（运行时错误体即 shared.v1.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".torchwood.shared.v1.ErrorResponse" } }
    }
  }
};

service DatabasesService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_API_KEY };

  rpc CreateDatabase(CreateDatabaseRequest) returns (Database) {
    option (google.api.http) = { post: "/v1/server/databases", body: "*" };
  }

  rpc ListDatabases(shared.v1.ListRequest) returns (ListDatabasesResponse) {
    option (google.api.http) = { get: "/v1/server/databases" };
  }

  rpc GetDatabase(GetDatabaseRequest) returns (Database) {
    option (google.api.http) = { get: "/v1/server/databases/{id}" };
  }

  rpc DeleteDatabase(GetDatabaseRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/databases/{id}" };
  }

  rpc CreateCollection(CreateCollectionRequest) returns (Collection) {
    option (google.api.http) = { post: "/v1/server/databases/{database_id}/collections", body: "*" };
  }

  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse) {
    option (google.api.http) = { get: "/v1/server/databases/{database_id}/collections" };
  }

  rpc GetCollection(GetCollectionRequest) returns (Collection) {
    option (google.api.http) = { get: "/v1/server/databases/{database_id}/collections/{collection_id}" };
  }

  rpc DeleteCollection(GetCollectionRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/databases/{database_id}/collections/{collection_id}" };
  }

  rpc UpdateCollection(UpdateCollectionRequest) returns (Collection) {
    option (google.api.http) = { patch: "/v1/server/databases/{database_id}/collections/{collection_id}", body: "*" };
  }

  rpc CreateAttribute(CreateAttributeRequest) returns (Attribute) {
    option (google.api.http) = { post: "/v1/server/databases/{database_id}/collections/{collection_id}/attributes", body: "*" };
  }

  rpc DeleteAttribute(DeleteAttributeRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/databases/{database_id}/collections/{collection_id}/attributes/{key}" };
  }

  rpc CreateIndex(CreateIndexRequest) returns (Index) {
    option (google.api.http) = { post: "/v1/server/databases/{database_id}/collections/{collection_id}/indexes", body: "*" };
  }

  rpc DeleteIndex(DeleteIndexRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/databases/{database_id}/collections/{collection_id}/indexes/{index_id}" };
  }

  rpc CreateDocument(CreateDocumentRequest) returns (shared.v1.Document) {
    option (google.api.http) = { post: "/v1/server/databases/{database_id}/collections/{collection_id}/documents", body: "*" };
    // 自定义方法说明：documents:count / documents:bulkUpdate /
    // documents:bulkDelete 为自定义方法段（REST 自定义动词），不再占用
    // document_id 命名空间；document_id 可自由取任意合法值。
  }

  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/server/databases/{database_id}/collections/{collection_id}/documents"
      additional_bindings {
        post: "/v1/server/databases/{database_id}/collections/{collection_id}/documents:list"
        body: "query"
      }
    };
  }

  rpc GetDocument(GetDocumentRequest) returns (shared.v1.Document) {
    option (google.api.http) = { get: "/v1/server/databases/{database_id}/collections/{collection_id}/documents/{document_id}" };
  }

  rpc UpdateDocument(UpdateDocumentRequest) returns (shared.v1.Document) {
    option (google.api.http) = { patch: "/v1/server/databases/{database_id}/collections/{collection_id}/documents/{document_id}", body: "*" };
  }

  rpc UpsertDocument(UpsertDocumentRequest) returns (shared.v1.Document) {
    option (google.api.http) = { put: "/v1/server/databases/{database_id}/collections/{collection_id}/documents/{document_id}", body: "*" };
  }

  rpc DeleteDocument(DeleteDocumentRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/databases/{database_id}/collections/{collection_id}/documents/{document_id}" };
  }

  rpc CountDocuments(CountDocumentsRequest) returns (CountDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/server/databases/{database_id}/collections/{collection_id}/documents:count"
      additional_bindings {
        post: "/v1/server/databases/{database_id}/collections/{collection_id}/documents:count"
        body: "*"
      }
    };
  }

  // AggregateDocuments 在权限过滤后的可见行集上执行聚合（redesign §4.1 +
  // §10.5 P1；§11-J D1：不可见行不进聚合、group 键不泄露）。count 已有独立
  // RPC（:count），不并入。聚合目标须为声明的数值属性（integer/float）；
  // 空集语义 sum=0、avg/min/max 无值；过滤算子与 ListDocuments 同语法，
  // 排序/分页算子无意义（整集聚合）。
  rpc AggregateDocuments(AggregateDocumentsRequest) returns (AggregateDocumentsResponse) {
    option (google.api.http) = { post: "/v1/server/databases/{database_id}/collections/{collection_id}/documents:aggregate", body: "*" };
  }

  rpc BulkUpdateDocuments(BulkUpdateDocumentsRequest) returns (BulkDocumentsResponse) {
    option (google.api.http) = { patch: "/v1/server/databases/{database_id}/collections/{collection_id}/documents:bulkUpdate", body: "*" };
  }

  rpc BulkDeleteDocuments(BulkDeleteDocumentsRequest) returns (BulkDocumentsResponse) {
    option (google.api.http) = { post: "/v1/server/databases/{database_id}/collections/{collection_id}/documents:bulkDelete", body: "*" };
  }

  // ExecuteTransactions 在单事务内执行异构 op 批（redesign §4.8 事务内核
  // Phase 1，Bulk 的泛化）。op 数上限 1000（对齐 MaxBulkOperations）；
  // ATOMIC（默认）任一 op 失败整批回滚；PARTIAL 逐 op 独立执行（savepoint），
  // 已成功不回滚，返回 per-op 结果。
  rpc ExecuteTransactions(ExecuteTransactionsRequest) returns (ExecuteTransactionsResponse) {
    option (google.api.http) = { post: "/v1/server/databases/{database_id}/documents:execute-tx", body: "*" };
  }
}

message CreateDatabaseRequest {
  string id = 1;
  string name = 2;
}

message GetDatabaseRequest {
  string id = 1;
}

message ListDatabasesResponse {
  repeated Database databases = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message Database {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message CreateCollectionRequest {
  string database_id = 1;
  string id = 2;
  string name = 3;
  repeated string permissions = 4;
  optional bool document_security = 5;
}

message ListCollectionsRequest {
  string database_id = 1;
  repeated string queries = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message GetCollectionRequest {
  string database_id = 1;
  string collection_id = 2;
}

message UpdateCollectionRequest {
  string database_id = 1;
  string collection_id = 2;
  // optional：未设置（或空串）= 不修改；设置非空串 = 更新（R10-P1-6；
  // adapter 对空串同样按不修改处理，清空 name 的语义暂不支持）。
  optional string name = 3;
  optional PermissionsUpdate permissions = 4;
  optional bool document_security = 5;
  optional bool disabled = 6;
}

message PermissionsUpdate {
  repeated string values = 1;
}

message ListCollectionsResponse {
  repeated Collection collections = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message Collection {
  string id = 1;
  string database_id = 2;
  string name = 3;
  repeated string permissions = 4;
  repeated Attribute attributes = 5;
  repeated Index indexes = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool document_security = 9;
  bool disabled = 10;
  bool is_system = 11;
}

message CreateAttributeRequest {
  string database_id = 1;
  string collection_id = 2;
  string key = 3;
  string type = 4;
  int32 size = 5;
  bool required = 6;
  bool array = 7;
  string default_value = 8;
}

message DeleteAttributeRequest {
  string database_id = 1;
  string collection_id = 2;
  string key = 3;
}

message Attribute {
  string id = 1;
  string key = 2;
  string type = 3;
  int32 size = 4;
  bool required = 5;
  bool array = 6;
  string default_value = 7;
}

message CreateIndexRequest {
  string database_id = 1;
  string collection_id = 2;
  string id = 3;
  string type = 4;
  repeated string attributes = 5;
  repeated string orders = 6;
}

message DeleteIndexRequest {
  string database_id = 1;
  string collection_id = 2;
  string index_id = 3;
}

message Index {
  string id = 1;
  string type = 2;
  repeated string attributes = 3;
  repeated string orders = 4;
}

message CreateDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  // 客户端自选 document_id；documents:count / documents:bulkUpdate /
  // documents:bulkDelete 为自定义方法段（REST 自定义动词），不再占用
  // document_id 命名空间，可自由取任意合法值。
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  // 写幂等键（redesign §4.1/§10.1）：作用域 (project, actor, request_id)，
  // 24h 内同键重放返回首次成功响应（响应头 x-torchwood-replayed: true）；
  // 同键不同请求 → IDEMPOTENCY.KEY_CONFLICT。HTTP 面等价 Idempotency-Key 头。
  optional string request_id = 6;
}

message UpdateDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  map<string, int64> increment = 6;
  // 用户集合强制 OCC：必须与当前行 _version 相等；缺省 → FailedPrecondition
  // （DOCUMENT.VERSION_REQUIRED）；显式 0 → InvalidArgument
  // （DOCUMENT.VERSION_INVALID）。
  optional int64 version = 7;
  // 写幂等键，语义同 CreateDocumentRequest.request_id。
  optional string request_id = 8;
}

message UpsertDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  repeated string conflict_columns = 6;
  // 写幂等键，语义同 CreateDocumentRequest.request_id。
  optional string request_id = 7;
}

message GetDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
}

message DeleteDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  // 用户集合强制 OCC：必须与当前行 _version 相等；缺省 → FailedPrecondition
  // （DOCUMENT.VERSION_REQUIRED）；显式 0 → InvalidArgument
  // （DOCUMENT.VERSION_INVALID）。
  optional int64 version = 4;
  // 写幂等键，语义同 CreateDocumentRequest.request_id。
  optional string request_id = 5;
}

message ListDocumentsRequest {
  string database_id = 1;
  string collection_id = 2;
  repeated string queries = 3;
  int32 page_size = 4;
  string page_token = 5;
  // Typed AST. Dual-stack with queries/page_size/page_token; both set and
  // conflicting → InvalidArgument. See docs/review/wave2-e4-query-ast.md.
  optional torchwood.shared.v1.Query query = 6;
}

message ListDocumentsResponse {
  repeated shared.v1.Document documents = 1;
  shared.v1.ListResponseMeta meta = 2;
}

// CountDocumentsRequest 独立于 ListDocumentsRequest（P3-9）：不暴露无效分页参数（page_size/page_token）。
message CountDocumentsRequest {
  string database_id = 1;
  string collection_id = 2;
  repeated string queries = 3;
  // Typed AST. Dual-stack with queries; both set and conflicting → InvalidArgument.
  optional torchwood.shared.v1.Query query = 4;
}

message CountDocumentsResponse {
  int64 count = 1;
}

// AggregateDocuments：sum/avg/min/max + 可选单键 group_by（redesign §4.1 +
// §11-J D1；count 已有独立 RPC 不并入）。

enum AggregateFunction {
  AGGREGATE_FUNCTION_UNSPECIFIED = 0;
  AGGREGATE_FUNCTION_SUM = 1;
  AGGREGATE_FUNCTION_AVG = 2;
  AGGREGATE_FUNCTION_MIN = 3;
  AGGREGATE_FUNCTION_MAX = 4;
}

// 单个聚合项：field 须为集合声明的数值属性（integer/float）。
message AggregateSpec {
  AggregateFunction function = 1;
  string field = 2;
}

message AggregateDocumentsRequest {
  string database_id = 1;
  string collection_id = 2;
  // 过滤（与 ListDocuments 同语法）；排序/分页算子无意义（整集聚合）。
  repeated string queries = 3;
  // 至少一项；UNSPECIFIED → InvalidArgument。
  repeated AggregateSpec aggregations = 4;
  // 可选单键 group_by：须为已声明属性；键按 text 序列化且只来自可见行
  //（D1：不可见行的键不会出现）。
  optional string group_by = 5;
  // Typed AST filter. Dual-stack with queries; both set and conflicting → InvalidArgument.
  optional torchwood.shared.v1.Query query = 6;
}

// 单个聚合值：value 未设置 = 空集下的 avg/min/max（无值；sum 空集恒 0）。
message AggregateValue {
  AggregateFunction function = 1;
  string field = 2;
  optional double value = 3;
}

// 一个聚合组：无 group_by 时恰一组且 group_key 未设置；group_by 属性未设置
// 的行归入 group_key 未设置的组。
message AggregateGroup {
  optional string group_key = 1;
  repeated AggregateValue values = 2;
}

message AggregateDocumentsResponse {
  repeated AggregateGroup groups = 1;
}

message BulkUpdateDocumentsRequest {
  string database_id = 1;
  string collection_id = 2;
  repeated string document_ids = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  // 写幂等键，语义同 CreateDocumentRequest.request_id（幂等单元 = 批）。
  optional string request_id = 6;
}

message BulkDeleteDocumentsRequest {
  string database_id = 1;
  string collection_id = 2;
  repeated string document_ids = 3;
  // 写幂等键，语义同 CreateDocumentRequest.request_id（幂等单元 = 批）。
  optional string request_id = 4;
}

message BulkDocumentsResponse {
  int64 affected = 1;
}

// ExecuteTransactions：op 模型与结果（redesign §4.8/E1——复用旧
// document_transaction_ops 字段族；单 database 批，跨库批量等需求证据）。

enum TransactionOpType {
  TRANSACTION_OP_TYPE_UNSPECIFIED = 0;
  TRANSACTION_OP_TYPE_CREATE = 1;
  TRANSACTION_OP_TYPE_UPDATE = 2;
  TRANSACTION_OP_TYPE_UPSERT = 3;
  TRANSACTION_OP_TYPE_DELETE = 4;
}

enum TransactionMode {
  // 缺省等价 ATOMIC（proto3 零值不可依赖，服务端对 UNSPECIFIED 按 ATOMIC 处理）。
  TRANSACTION_MODE_UNSPECIFIED = 0;
  TRANSACTION_MODE_ATOMIC = 1;
  TRANSACTION_MODE_PARTIAL = 2;
}

// TransactionOp 是单批中的一个操作。字段族是各 op 类型的并集，消费不对称
//（按 type）：
//   - data：create/update/upsert 写入；delete 忽略；
//   - permissions：create/upsert 非空时作为文档 ACL（空则种子创建者私有，
//     与单文档 API 同语义）；update/delete 非空时替换、空则不变更；
//   - increment：仅 update 消费（原子增量）；其余类型忽略；
//   - expected_version：仅 update/delete 消费（见下方三态注释；upsert 忽略
//     ——upsert 恒为盲写 +1 的 LWW 契约）；
//   - conflict_columns：仅 upsert 消费，必须无序命中集合一个 unique 索引。
message TransactionOp {
  TransactionOpType type = 1;
  string collection_id = 2;
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  map<string, int64> increment = 6;
  // OCC 原语三态（redesign §2-C4 + §4.8 Phase 1 裁决②；仅 update/delete 消费）：
  // 设置 → CAS；未设置 → update 盲写 +1（LWW 契约；delete 缺省为
  // version_required，不支持盲删）；显式 0 → InvalidArgument
  // （DOCUMENT.VERSION_INVALID，缺省是 FailedPrecondition/
  // DOCUMENT.VERSION_REQUIRED，两者不同）。
  optional int64 expected_version = 7;
  // upsert 专用：必须无序命中集合一个 unique 索引（其余 op 类型忽略）。
  repeated string conflict_columns = 8;
}

message ExecuteTransactionsRequest {
  string database_id = 1;
  repeated TransactionOp ops = 2;
  TransactionMode mode = 3;
  // 写幂等键，语义同 CreateDocumentRequest.request_id；幂等覆盖整批——
  // 重放返回首次完整结果（含 PARTIAL per-op 结果，§11-E2）。
  optional string request_id = 4;
}

enum TransactionOpStatus {
  TRANSACTION_OP_STATUS_UNSPECIFIED = 0;
  TRANSACTION_OP_STATUS_OK = 1;
  TRANSACTION_OP_STATUS_ERROR = 2;
}

message TransactionOpResult {
  int32 index = 1;
  TransactionOpStatus status = 2;
  // upsert 冲突命中已有行时为实际目标行 ID。
  string document_id = 3;
  // 写后版本（delete 类为 0）。
  int64 version = 4;
  // status=ERROR 时（仅 PARTIAL）：稳定域码（如 DOCUMENT.VERSION_CONFLICT）。
  string error_code = 5;
  string error_message = 6;
}

message ExecuteTransactionsResponse {
  // ATOMIC：整体成功才返回（失败为带 op index 的 gRPC 错误，整批已回滚）；
  // PARTIAL：逐 op 结果（含失败项），已成功不回滚。
  repeated TransactionOpResult results = 1;
}
