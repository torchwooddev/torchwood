syntax = "proto3";

package torchwood.server.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/server/v1;serverv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

// 服务默认 access=api_key：swagger 顶层声明 X-API-Key security（详见
// shared/v1/openapi.proto 的建模约定；本服务全部方法继承，无需逐方法覆盖）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "Server API key（需同时携带 X-Torchwood-Project 请求头）"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "apiKey"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "api_key" }
  }
};

service APIKeysService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_API_KEY };

  rpc CreateAPIKey(CreateAPIKeyRequest) returns (APIKeyWithSecret) {
    option (google.api.http) = { post: "/v1/server/api-keys", body: "*" };
  }

  rpc ListAPIKeys(shared.v1.ListRequest) returns (ListAPIKeysResponse) {
    option (google.api.http) = { get: "/v1/server/api-keys" };
  }

  rpc GetAPIKey(GetAPIKeyRequest) returns (APIKey) {
    option (google.api.http) = { get: "/v1/server/api-keys/{id}" };
  }

  rpc DeleteAPIKey(GetAPIKeyRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/server/api-keys/{id}" };
  }
}

message CreateAPIKeyRequest {
  string name = 1;
  repeated string scopes = 2;
  int64 expire_at = 3; // unix seconds, 0 = no expiry
}

message GetAPIKeyRequest {
  string id = 1;
}

message ListAPIKeysResponse {
  repeated APIKey api_keys = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message APIKeyWithSecret {
  APIKey api_key = 1;
  // 明文 API key secret，仅创建响应返回一次，之后任何接口不再回显
  // （持久层仅存哈希；泄露需删除重建）。
  string secret = 2;
}

message APIKey {
  string id = 1;
  string name = 2;
  repeated string scopes = 3;
  bool enabled = 4;
  google.protobuf.Timestamp expire_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
