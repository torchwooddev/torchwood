syntax = "proto3";

package torchwood.client.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/client/v1;clientv1";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";
import "shared/v1/query.proto";

// 服务默认 access=authenticated：swagger 顶层声明 Bearer security；
// ACCESS_PUBLIC 方法逐方法声明 security: [] + x-torchwood-access: "public"
// （详见 docs/developer/09-api-guide.md §1.4 的 OpenAPI 建模约定）。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "apiKey"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-API-Key"
        description: "Server API key（需同时携带 X-Torchwood-Project 请求头）"
      }
    }
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "格式: Bearer <jwt>（Client API 登录态）"
      }
    }
    security: {
      key: "cookie"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Cookie"
        description: "TORCHWOOD_session_console=<sid>（Console admin 会话）"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
  extensions: {
    key: "x-torchwood-access"
    value: { string_value: "authenticated" }
  }
};

service DatabasesService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_AUTHENTICATED };

  // 自定义方法说明：documents:count 为自定义方法段（REST 自定义动词），不再占用
  // document_id 命名空间；document_id 可自由取任意合法值。
  rpc CreateDocument(CreateDocumentRequest) returns (Document) {
    option (google.api.http) = { post: "/v1/databases/{database_id}/collections/{collection_id}/documents", body: "*" };
  }

  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/databases/{database_id}/collections/{collection_id}/documents"
      additional_bindings {
        post: "/v1/databases/{database_id}/collections/{collection_id}/documents:list"
        body: "query"
      }
    };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc GetDocument(GetDocumentRequest) returns (Document) {
    option (google.api.http) = { get: "/v1/databases/{database_id}/collections/{collection_id}/documents/{document_id}" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc UpdateDocument(UpdateDocumentRequest) returns (Document) {
    option (google.api.http) = { patch: "/v1/databases/{database_id}/collections/{collection_id}/documents/{document_id}", body: "*" };
  }

  rpc UpsertDocument(UpsertDocumentRequest) returns (Document) {
    option (google.api.http) = { put: "/v1/databases/{database_id}/collections/{collection_id}/documents/{document_id}", body: "*" };
  }

  rpc DeleteDocument(DeleteDocumentRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/databases/{database_id}/collections/{collection_id}/documents/{document_id}" };
  }

  rpc CountDocuments(ListDocumentsRequest) returns (CountDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/databases/{database_id}/collections/{collection_id}/documents:count"
      additional_bindings {
        post: "/v1/databases/{database_id}/collections/{collection_id}/documents:count"
        body: "query"
      }
    };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-torchwood-access"
        value: { string_value: "public" }
      }
    };
  }

  // 单库事务（v2 设计 §5）：暂存文档写操作，Commit 单段事务应用并写 outbox。
  rpc CreateTransaction(CreateTransactionRequest) returns (Transaction) {
    option (google.api.http) = { post: "/v1/databases/{database_id}/transactions", body: "*" };
  }

  rpc GetTransaction(GetTransactionRequest) returns (Transaction) {
    option (google.api.http) = { get: "/v1/databases/{database_id}/transactions/{transaction_id}" };
  }

  rpc CreateTransactionDocument(CreateTransactionDocumentRequest) returns (TransactionOp) {
    option (google.api.http) = { post: "/v1/databases/{database_id}/transactions/{transaction_id}/documents", body: "*" };
  }

  rpc UpdateTransactionDocument(UpdateTransactionDocumentRequest) returns (TransactionOp) {
    option (google.api.http) = { patch: "/v1/databases/{database_id}/transactions/{transaction_id}/collections/{collection_id}/documents/{document_id}", body: "*" };
  }

  rpc DeleteTransactionDocument(DeleteTransactionDocumentRequest) returns (TransactionOp) {
    option (google.api.http) = { delete: "/v1/databases/{database_id}/transactions/{transaction_id}/collections/{collection_id}/documents/{document_id}" };
  }

  rpc UpsertTransactionDocument(UpsertTransactionDocumentRequest) returns (TransactionOp) {
    option (google.api.http) = { put: "/v1/databases/{database_id}/transactions/{transaction_id}/collections/{collection_id}/documents/{document_id}", body: "*" };
  }

  rpc CommitTransaction(CommitTransactionRequest) returns (Transaction) {
    option (google.api.http) = { post: "/v1/databases/{database_id}/transactions/{transaction_id}:commit", body: "*" };
  }

  rpc RollbackTransaction(RollbackTransactionRequest) returns (Transaction) {
    option (google.api.http) = { delete: "/v1/databases/{database_id}/transactions/{transaction_id}" };
  }
}

message Document {
  string id = 1;
  google.protobuf.Struct data = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  repeated string permissions = 5;
  // 用户集合为当前 _version；系统集合恒为 0。
  int64 version = 6;
}

message CreateDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  // 客户端自选 document_id；documents:count 为自定义方法段（REST 自定义动词），
  // 不再占用 document_id 命名空间，可自由取任意合法值。
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
}

message UpdateDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  map<string, int64> increment = 6;
  // 用户集合强制 OCC：必须与当前行 _version 相等；未设置 = version_required。
  optional int64 version = 7;
}

message UpsertDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  google.protobuf.Struct data = 4;
  repeated string permissions = 5;
  repeated string conflict_columns = 6;
}

message GetDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  string project_id = 4;
}

message DeleteDocumentRequest {
  string database_id = 1;
  string collection_id = 2;
  string document_id = 3;
  // 用户集合强制 OCC：必须与当前行 _version 相等；未设置 = version_required。
  optional int64 version = 4;
}

message ListDocumentsRequest {
  string database_id = 1;
  string collection_id = 2;
  repeated string queries = 3;
  int32 page_size = 4;
  string page_token = 5;
  string project_id = 6;
  // Typed AST. Dual-stack with queries/page_size/page_token; both set and
  // conflicting → InvalidArgument. See docs/review/wave2-e4-query-ast.md.
  optional torchwood.shared.v1.Query query = 7;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  shared.v1.ListResponseMeta meta = 2;
}

message CountDocumentsResponse {
  int64 count = 1;
}

// 事务消息（Client/Server 两侧字段号对齐，v2 设计 §事务 RPC）。
message Transaction {
  string id = 1;
  string database_id = 2;
  string status = 3; // pending|committed|rolled_back|expired
  string created_by = 4;
  google.protobuf.Timestamp expire_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated TransactionOp operations = 8;
}

message TransactionOp {
  string id = 1;
  int32 seq = 2;
  string op_type = 3; // create|update|delete|upsert
  string collection_id = 4;
  string document_id = 5;
  google.protobuf.Struct data = 6;
  repeated string permissions = 7;
  map<string, int64> increment = 8;
  optional int64 version = 9;
  // upsert 的冲突列（须匹配集合唯一索引），随 op 持久化供 Commit 回放。
  repeated string conflict_columns = 10;
}

message CreateTransactionRequest {
  string database_id = 1;
}

message GetTransactionRequest {
  string database_id = 1;
  string transaction_id = 2;
}

message CreateTransactionDocumentRequest {
  string database_id = 1;
  string transaction_id = 2;
  string collection_id = 3;
  string document_id = 4;
  google.protobuf.Struct data = 5;
  repeated string permissions = 6;
}

message UpdateTransactionDocumentRequest {
  string database_id = 1;
  string transaction_id = 2;
  string collection_id = 3;
  string document_id = 4;
  google.protobuf.Struct data = 5;
  repeated string permissions = 6;
  map<string, int64> increment = 7;
  // 必填（presence）：Commit 时与当前行 _version 做 OCC。
  optional int64 version = 8;
}

message DeleteTransactionDocumentRequest {
  string database_id = 1;
  string transaction_id = 2;
  string collection_id = 3;
  string document_id = 4;
  // 必填（presence）；REST query。Commit 时与当前行 _version 做 OCC。
  optional int64 version = 5;
}

message UpsertTransactionDocumentRequest {
  string database_id = 1;
  string transaction_id = 2;
  string collection_id = 3;
  string document_id = 4;
  google.protobuf.Struct data = 5;
  repeated string permissions = 6;
  repeated string conflict_columns = 7;
}

message CommitTransactionRequest {
  string database_id = 1;
  string transaction_id = 2;
}

message RollbackTransactionRequest {
  string database_id = 1;
  string transaction_id = 2;
}
