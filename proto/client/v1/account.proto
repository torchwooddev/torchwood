syntax = "proto3";

package torchwood.client.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/client/v1;clientv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "shared/v1/authz.proto";
import "shared/v1/common.proto";

service AccountService {
  option (torchwood.shared.v1.service_auth) = { default_access: ACCESS_AUTHENTICATED };

  rpc SignUp(SignUpRequest) returns (SignUpResponse) {
    option (google.api.http) = { post: "/v1/account/sign-up", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc SignIn(SignInRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/account/sign-in", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc SignOut(SignOutRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { post: "/v1/account/sign-out", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = { post: "/v1/account/refresh", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc Me(MeRequest) returns (Account) {
    option (google.api.http) = { get: "/v1/account/me" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc UpdateAccount(UpdateAccountRequest) returns (Account) {
    option (google.api.http) = { patch: "/v1/account", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = { get: "/v1/account/sessions" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc DeleteSession(DeleteSessionRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/account/sessions/{session_id}" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc DeleteSessions(DeleteSessionsRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/account/sessions" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc GetPrefs(GetPrefsRequest) returns (GetPrefsResponse) {
    option (google.api.http) = { get: "/v1/account/prefs" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc UpdatePrefs(UpdatePrefsRequest) returns (GetPrefsResponse) {
    option (google.api.http) = { put: "/v1/account/prefs", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc CreateEmailOTP(CreateEmailOTPRequest) returns (ChallengeResponse) {
    option (google.api.http) = { post: "/v1/account/sessions/email-otp", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc CreateEmailOTPSession(CreateEmailOTPSessionRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/account/sessions/email-otp/verify", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc CreateOAuth2Session(CreateOAuth2SessionRequest) returns (CreateOAuth2SessionResponse) {
    option (google.api.http) = { get: "/v1/account/sessions/oauth2/{provider}" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc CreateOAuth2TokenSession(CreateOAuth2TokenSessionRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/account/sessions/oauth2/{provider}/token", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc CreatePhoneOTP(CreatePhoneOTPRequest) returns (ChallengeResponse) {
    option (google.api.http) = { post: "/v1/account/sessions/phone-otp", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc CreatePhoneOTPSession(CreatePhoneOTPSessionRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/account/sessions/phone-otp/verify", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc CreateWeChatMiniProgramSession(CreateWeChatMiniProgramSessionRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/account/sessions/wechat/miniprogram", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc CreateAnonymousSession(CreateAnonymousSessionRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/account/sessions/anonymous", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc CreateOAuth2LinkSession(CreateOAuth2LinkSessionRequest) returns (CreateOAuth2SessionResponse) {
    option (google.api.http) = { get: "/v1/account/sessions/oauth2/{provider}/link" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc CreateOAuth2LinkTokenSession(CreateOAuth2LinkTokenSessionRequest) returns (Account) {
    option (google.api.http) = { post: "/v1/account/sessions/oauth2/{provider}/link/token", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc CreateVerification(CreateVerificationRequest) returns (CreateVerificationResponse) {
    option (google.api.http) = { post: "/v1/account/verification", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc UpdateVerification(UpdateVerificationRequest) returns (Account) {
    option (google.api.http) = { put: "/v1/account/verification", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc CreateRecovery(CreateRecoveryRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { post: "/v1/account/recovery", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc UpdateRecovery(UpdateRecoveryRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { put: "/v1/account/recovery", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  // MFA
  rpc ListFactors(ListFactorsRequest) returns (ListFactorsResponse) {
    option (google.api.http) = { get: "/v1/account/mfa" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc CreateTOTPFactor(CreateTOTPFactorRequest) returns (TOTPFactor) {
    option (google.api.http) = { post: "/v1/account/mfa/totp", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc VerifyTOTPFactor(VerifyTOTPFactorRequest) returns (Factor) {
    option (google.api.http) = { put: "/v1/account/mfa/totp", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc DeleteFactor(DeleteFactorRequest) returns (shared.v1.Empty) {
    option (google.api.http) = { delete: "/v1/account/mfa/{factor_id}" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  rpc CreateMFASession(CreateMFASessionRequest) returns (SignInResponse) {
    option (google.api.http) = { post: "/v1/account/mfa/challenge", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  // 一次性 JWT
  rpc CreateJWT(CreateJWTRequest) returns (CreateJWTResponse) {
    option (google.api.http) = { post: "/v1/account/jwt", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }

  // Magic URL
  rpc CreateMagicURLSession(CreateMagicURLSessionRequest) returns (ChallengeResponse) {
    option (google.api.http) = { post: "/v1/account/sessions/magic-url", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  rpc UpdateMagicURLSession(UpdateMagicURLSessionRequest) returns (SignInResponse) {
    option (google.api.http) = { put: "/v1/account/sessions/magic-url", body: "*" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PUBLIC };
  }

  // 账号日志
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse) {
    option (google.api.http) = { get: "/v1/account/logs" };
    option (torchwood.shared.v1.method_auth) = { access: ACCESS_PERMISSION, permissions: ["users"] };
  }
}

message SignUpRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string project_id = 4;
}

message SignInRequest {
  string email = 1;
  string password = 2;
  string project_id = 3;
}

message SignOutRequest {
  string project_id = 1;
}

message MeRequest {
  string project_id = 1;
}

message Account {
  string id = 1;
  string email = 2;
  string name = 3;
  string status = 4;
  bool email_verified = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message TokenBundle {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
}

message SignUpResponse {
  Account account = 1;
  TokenBundle tokens = 2;
  bool mfa_required = 3;        // 用户有 verified 因子且未完成挑战时 true
  string challenge_token = 4;   // mfa_required 时返回（5min 一次性）
  repeated Factor factors = 5;  // mfa_required 时返回（不含 secret）
}

message SignInResponse {
  Account account = 1;
  TokenBundle tokens = 2;
  bool mfa_required = 3;        // 用户有 verified 因子且未完成挑战时 true
  string challenge_token = 4;   // mfa_required 时返回（5min 一次性）
  repeated Factor factors = 5;  // mfa_required 时返回（不含 secret）
}

message RefreshTokenRequest {
  string project_id = 1;
  string refresh_token = 2;
}

message RefreshTokenResponse {
  TokenBundle tokens = 1;
}

message UpdateAccountRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string old_password = 4;
}

message Session {
  string id = 1;
  string user_id = 2;
  string provider = 3;
  string user_agent = 4;
  string ip = 5;
  google.protobuf.Timestamp expire_at = 6;
  google.protobuf.Timestamp created_at = 7;
  bool current = 8;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionsRequest {
  bool keep_current = 1;
}

message GetPrefsRequest {}

message GetPrefsResponse {
  google.protobuf.Struct prefs = 1;
}

message UpdatePrefsRequest {
  google.protobuf.Struct prefs = 1;
}

message CreateEmailOTPRequest {
  string project_id = 1;
  string email = 2;
}

message CreateEmailOTPSessionRequest {
  string project_id = 1;
  string email = 2;
  string challenge_id = 3;
  string otp = 4;
}

message ChallengeResponse {
  string challenge_id = 1;
  int64 expire_at = 2;
}

message CreateOAuth2SessionRequest {
  string provider = 1;
  string project_id = 2;
  string success = 3;
  string failure = 4;
}

message CreateOAuth2SessionResponse {
  string redirect_url = 1;
}

message CreateOAuth2TokenSessionRequest {
  string provider = 1;
  string project_id = 2;
  string success = 3;
  string failure = 4;
  string code = 5;
  string state = 6;
}

message CreatePhoneOTPRequest {
  string project_id = 1;
  string phone = 2;
}

message CreatePhoneOTPSessionRequest {
  string project_id = 1;
  string phone = 2;
  string challenge_id = 3;
  string otp = 4;
}

message CreateWeChatMiniProgramSessionRequest {
  string project_id = 1;
  string code = 2;
}

message CreateAnonymousSessionRequest {
  string project_id = 1;
}

message CreateOAuth2LinkSessionRequest {
  string provider = 1;
  string project_id = 2;
  string success = 3;
  string failure = 4;
}

message CreateOAuth2LinkTokenSessionRequest {
  string provider = 1;
  string project_id = 2;
  string code = 3;
  string state = 4;
}

message CreateVerificationRequest {
  string project_id = 1;
  string url = 2;
}

message CreateVerificationResponse {
  string user_id = 1;
  int64 expire_at = 2;
}

message UpdateVerificationRequest {
  string project_id = 1;
  string user_id = 2;
  string secret = 3;
}

message CreateRecoveryRequest {
  string project_id = 1;
  string email = 2;
  string url = 3;
}

message UpdateRecoveryRequest {
  string project_id = 1;
  string user_id = 2;
  string secret = 3;
  string password = 4;
}

// ---- MFA ----
message Factor {
  string id = 1;
  string type = 2;      // totp
  string status = 3;    // pending / verified
  google.protobuf.Timestamp created_at = 4;
}

message ListFactorsRequest {}

message ListFactorsResponse {
  repeated Factor factors = 1;
}

message CreateTOTPFactorRequest {}

message TOTPFactor {
  Factor factor = 1;
  string secret = 2;        // 仅创建响应返回明文 secret
  string otpauth_url = 3;   // otpauth://totp/{issuer}:{email}?secret=...&issuer=...
}

message VerifyTOTPFactorRequest {
  string factor_id = 1;
  string code = 2;
}

message DeleteFactorRequest {
  string factor_id = 1;
}

message CreateMFASessionRequest {
  string project_id = 1;
  string challenge_token = 2;
  string factor_id = 3;
  string code = 4;
}

// ---- JWT ----
message CreateJWTRequest {}

message CreateJWTResponse {
  string token = 1;
}

// ---- Magic URL ----
message CreateMagicURLSessionRequest {
  string project_id = 1;
  string email = 2;
  string url = 3;   // 登录成功后的回调地址（白名单校验）
}

message UpdateMagicURLSessionRequest {
  string project_id = 1;
  string user_id = 2;
  string secret = 3;
}

// ---- Logs ----
message ListLogsRequest {
  int32 limit = 1;
}

message LogEntry {
  string id = 1;
  string action = 2;        // gRPC 方法名（如 /torchwood.client.v1.AccountService/SignIn）
  string status = 3;
  string resource_id = 4;
  string ip = 5;
  string user_agent = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListLogsResponse {
  repeated LogEntry logs = 1;
}
