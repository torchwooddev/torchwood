syntax = "proto3";

package torchwood.shared.v1;

option go_package = "github.com/torchwooddev/torchwood/genproto/shared/v1;sharedv1";

// OpenAPI 认证建模约定（F11-1）。
//
// 所有服务 proto 文件通过
// `grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger` 文件选项声明
// securityDefinitions 与全局 security，使生成的 swagger.json 可被外部 Agent
// 直接用于鉴权调用（roadmap §0 验收标准）。
//
// 三个统一 security scheme（所有文件保持一致）：
//   - apiKey：请求头 X-API-Key —— Server API / Agent 调用（access=api_key）
//   - Bearer：Authorization: Bearer <jwt> —— Client API 登录态（access=authenticated/permission）
//   - cookie：Cookie: TORCHWOOD_session_console=<sid> —— Console admin 会话
//
// method_auth 的 access level 以 `x-torchwood-access` 扩展透传到 swagger 顶层
// 与 operation 级（值域 = AccessLevel 小写：public/authenticated/permission/api_key）：
//   - operation 未显式声明时继承 swagger 顶层（服务默认）值；
//   - ACCESS_PUBLIC 方法必须声明 security: []（匿名可达，覆盖全局 security）。
//
// 新增服务/方法的规范：文件级设置 openapiv2_swagger（security_definitions +
// security + extensions.x-torchwood-access）；与方法级 method_auth 不一致的
// 方法用 openapiv2_operation 覆盖（security + extensions.x-torchwood-access）。
message OpenAPI {
  // 统一 securityDefinitions 的 scheme 名（供工具/文档引用，勿改）。
  string api_key_scheme = 1; // "apiKey"，X-API-Key 请求头
  string bearer_scheme = 2;  // "Bearer"，Authorization: Bearer <jwt>
  string cookie_scheme = 3;  // "cookie"，TORCHWOOD_session_console 会话 cookie
  // x-torchwood-access 扩展键名（operation 级透传 method_auth access level）。
  string access_extension = 4; // "x-torchwood-access"
}
