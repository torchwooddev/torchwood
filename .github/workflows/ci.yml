name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: torchwood
          POSTGRES_PASSWORD: torchwood
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torchwood"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:latest
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TORCHWOOD_TEST_DATABASE_SOURCE: postgres://torchwood:torchwood@localhost:5432/TORCHWOOD_test?sslmode=disable
      TORCHWOOD_TEST_ADMIN_DATABASE_SOURCE: postgres://torchwood:torchwood@localhost:5432/postgres?sslmode=disable
      TORCHWOOD_TEST_MINIO_ENDPOINT: http://localhost:9000
      TORCHWOOD_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Pre-pull function runtime base images
        run: docker pull node:18-alpine && docker pull python:3.11-alpine

      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Tests (unit + integration)
        run: go test ./...

      - name: SDK Go tests (independent module)
        working-directory: sdk/go
        run: go test ./...

      - name: Build (console + server embed)
        run: task build

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Build (tsc + vite)
        run: pnpm build
