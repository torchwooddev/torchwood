name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: torchwood
          POSTGRES_PASSWORD: torchwood
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torchwood"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        # 与 docker/local/docker-compose.yml 的本地版本对齐（不追 latest）。
        image: minio/minio:RELEASE.2024-11-07T00-52-20Z
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TORCHWOOD_TEST_DATABASE_SOURCE: postgres://torchwood:torchwood@localhost:5432/TORCHWOOD_test?sslmode=disable
      TORCHWOOD_TEST_ADMIN_DATABASE_SOURCE: postgres://torchwood:torchwood@localhost:5432/postgres?sslmode=disable
      TORCHWOOD_TEST_MINIO_ENDPOINT: http://localhost:9000
      TORCHWOOD_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # golangci-lint --new-from-rev 需要 origin/main 可解析。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: v1.65.0

      - name: Buf lint
        run: buf lint

      - name: Buf breaking (proto field drift)
        run: buf breaking --against '.git#branch=origin/main'

      - name: Pre-pull function runtime base images
        run: docker pull node:18-alpine && docker pull python:3.11-alpine

      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Prepare console embed stub
        run: mkdir -p console/dist && touch console/dist/index.html

      - name: go vet
        run: go vet ./...

      # 棘轮：只拦相对 origin/main 的新增问题（存量 78 项为遗留债，见
      # docs/review/arch-review-2026-08-fix-plan.md W-H）。
      - name: golangci-lint (new issues only)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          args: --new-from-rev=origin/main ./...

      - name: Tests (unit + integration, race)
        run: go test -race ./...

      - name: SDK Go tests (independent module)
        working-directory: sdk/go
        run: go test -race ./...

      - name: Codegen drift check
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go build -o "$(go env GOPATH)/bin/protoc-gen-go" google.golang.org/protobuf/cmd/protoc-gen-go
          buf generate
          (cd internal/pkg/config && protoc -I. --go_out=. --go_opt=paths=source_relative ./config.proto)
          task wire-all
          git diff --exit-code -- genproto internal/pkg/config cmd go.mod go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: TS SDK test
        working-directory: sdk/typescript
        run: npm ci && npm run test

      - name: SDK demo build
        run: task sdk-demo-build

      - name: Build (console + server embed)
        run: task build

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Test (vitest)
        run: pnpm test

      - name: Build (tsc + vite)
        run: pnpm build
